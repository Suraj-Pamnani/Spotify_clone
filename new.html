<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify - Your favourite music is here</title>

  
    <script src="https://kit.fontawesome.com/26504e4a1f.js" crossorigin="anonymous"></script>


    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <ul>
            <li class="brand">
                <img src="logo.png" alt="Spotify">  
                Spotify
            </li>
            <li>Home</li>
            <li><a href="new2.html" class = 'About'>About</a></li>

        </ul>
    </nav>

    <div class="container">
        <div class="songList">
            <h1>Best of US</h1>

            <div class="songItemContainer">

        
                <div class="songItem">
                    <img src="1.jpg">
                    <span class="songName">Let me Love You</span>
                    <span class="timestamp">05:34 
                        <i id="0" class="fas songItemPlay fa-play-circle"></i>
                    </span>
                </div>

                <div class="songItem">
                    <img src="2.jpg">
                    <span class="songName">Invisible - NCS</span>
                    <span class="timestamp">04:21 
                        <i id="1" class="fas songItemPlay fa-play-circle"></i>
                    </span>
                </div>

                <div class="songItem">
                    <img src="3.jpg">
                    <span class="songName">On & On</span>
                    <span class="timestamp">03:46 
                        <i id="2" class="fas songItemPlay fa-play-circle"></i>
                    </span>
                </div>

                <div class="songItem">
                    <img src="4.jpg">
                    <span class="songName">Heroes Tonight</span>
                    <span class="timestamp">02:59 
                        <i id="3" class="fas songItemPlay fa-play-circle"></i>
                    </span>
                </div>
                <div class="songItem">
                    <img src="5.jpg">
                    <span class="songName">Heroes Tonight</span>
                    <span class="timestamp">04:49 
                        <i id="4" class="fas songItemPlay fa-play-circle"></i>
                    </span>
                </div>
                <div class="songItem">
                    <img src="6.jpg">
                    <span class="songName">Heroes Tonight</span>
                    <span class="timestamp">03:17
                        <i id="5" class="fas songItemPlay fa-play-circle"></i>
                    </span>
                </div>
                <div class="songItem">
                    <img src="7.jpg">
                    <span class="songName">Heroes Tonight</span>
                    <span class="timestamp">04:23 
                        <i id="6" class="fas songItemPlay fa-play-circle"></i>
                    </span>
                </div>
              
             
            </div>
        </div>

        <div class="songBanner"></div>
    </div>

    <div class="bottom">
        <input type="range" id="myProgressBar" min="0" value="0" max="100">

        <div class="icons">
            <i class="fas fa-2x fa-step-backward" id="previous"></i>
            <i class="fas fa-3x fa-play-circle" id="masterPlay"></i>
            <i class="fas fa-2x fa-step-forward" id="next"></i> 
        </div>

        <div class="songInfo">
            <img src="playing.gif" width="42px" id="gif">
            <span id="masterSongName">Warriyo - Mortals [NCS Release]</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
